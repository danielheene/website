paths:
  .github/workflows/ci.yml:
    ignore:
      # The E2E job reads these from the Testing environment (`environment:
      # Testing`), which a reusable workflow gets without declaring them under
      # `workflow_call.secrets`; declaring them there left them empty.
      - 'property "(test_services_host|database_url|redis_url|s3_endpoint|s3_bucket|s3_region|s3_access_key|s3_secret_key|ts_oauth_client_id|ts_oauth_secret)" is not defined'
