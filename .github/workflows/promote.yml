name: Promote Images

# On merge, retags the already-built images from this PR's head SHA (built
# and pushed by ci.yml, which was the required check that gated this merge)
# rather than rebuilding — `docker buildx imagetools create` is a registry
# metadata operation, so this takes seconds regardless of image size.
#
# The PR's head SHA is used as the source tag rather than the resulting merge
# commit SHA on main/develop: a squash or merge commit gets a new SHA even
# when its tree is identical to the PR head, so relying on that SHA existing
# in the registry would be wrong for squash merges. The head SHA is exactly
# what ci.yml built and is available on the `pull_request: closed` event
# regardless of which merge strategy was used.
#
#   develop merge -> retag as `edge`
#   main merge    -> retag as `latest` + the version release.yml just tagged
#
# The main-branch retag waits on release.yml's semantic-release run so it can
# read the version it just computed; it no-ops if that push produced no
# release (docs-only/chore changes bump nothing).
on:
  pull_request:
    types: [closed]
    branches:
      - main
      - develop
  workflow_run:
    workflows: [Release]
    types: [completed]

permissions:
  contents: read
  packages: write

env:
  REGISTRY: ghcr.io
  IMAGE_BASE: ghcr.io/${{ github.repository }}

jobs:
  promote-develop:
    name: Promote images to edge
    if: >-
      github.event_name == 'pull_request' &&
      github.event.pull_request.merged == true &&
      github.event.pull_request.base.ref == 'develop'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@c47758b77c9736f4b2ef4073d4d51994fabfe349 # v3.11.1

      - name: Log in to ghcr.io
        uses: docker/login-action@184bdaa0721073962dff0199f1fb9940f07167d # v3.6.0
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Retag app/worker/storybook as edge
        env:
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
        run: |
          for image in app worker storybook; do
            docker buildx imagetools create \
              --tag "${IMAGE_BASE}-${image}:edge" \
              "${IMAGE_BASE}-${image}:sha-${HEAD_SHA}"
          done

  promote-main:
    name: Promote images to latest + release version
    if: >-
      github.event_name == 'workflow_run' &&
      github.event.workflow_run.conclusion == 'success' &&
      github.event.workflow_run.head_branch == 'main'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: main
          fetch-depth: 0

      # semantic-release pushed the vX.Y.Z tag (if any) as part of the
      # Release workflow this job is chained after; the current package.json
      # version on main is the value to read, since that's what it bumped to.
      - name: Read released version
        id: version
        run: |
          version="v$(node -p 'require("./package.json").version')"
          # Nothing to promote if this push didn't actually cut a release
          # (e.g. a docs/chore-only push that semantic-release skipped) —
          # compare against the previous tag reachable from HEAD~1.
          if git describe --tags --exact-match HEAD >/dev/null 2>&1; then
            echo "released=true" >> "$GITHUB_OUTPUT"
            echo "version=$version" >> "$GITHUB_OUTPUT"
          else
            echo "released=false" >> "$GITHUB_OUTPUT"
          fi

      # The merge commit on main is not the SHA ci.yml built (see the
      # workflow-level comment), so the PR that produced this push is looked
      # up to recover the head SHA the images were actually tagged with.
      - name: Find source PR head SHA
        if: steps.version.outputs.released == 'true'
        id: pr
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          # semantic-release's own commit carries [skip ci] and isn't itself a
          # merge commit, so look at HEAD's parent — the actual merge — for
          # the PR association.
          merge_sha=$(git rev-parse HEAD~1)
          head_sha=$(gh pr list --repo "${{ github.repository }}" --state merged \
            --search "$merge_sha" --json headRefOid --jq '.[0].headRefOid')
          if [ -z "$head_sha" ] || [ "$head_sha" = "null" ]; then
            echo "Could not resolve the source PR's head SHA for $merge_sha" >&2
            exit 1
          fi
          echo "head_sha=$head_sha" >> "$GITHUB_OUTPUT"

      - name: Set up Docker Buildx
        if: steps.version.outputs.released == 'true'
        uses: docker/setup-buildx-action@c47758b77c9736f4b2ef4073d4d51994fabfe349 # v3.11.1

      - name: Log in to ghcr.io
        if: steps.version.outputs.released == 'true'
        uses: docker/login-action@184bdaa0721073962dff0199f1fb9940f07167d # v3.6.0
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Retag app/worker/storybook as latest + version
        if: steps.version.outputs.released == 'true'
        env:
          HEAD_SHA: ${{ steps.pr.outputs.head_sha }}
          VERSION: ${{ steps.version.outputs.version }}
        run: |
          for image in app worker storybook; do
            docker buildx imagetools create \
              --tag "${IMAGE_BASE}-${image}:latest" \
              --tag "${IMAGE_BASE}-${image}:${VERSION}" \
              "${IMAGE_BASE}-${image}:sha-${HEAD_SHA}"
          done
