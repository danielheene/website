name: Test

on:
  pull_request:
  push:
    branches:
      - main
      - develop

jobs:
  unit:
    name: Unit Tests
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Setup pnpm
        uses: pnpm/action-setup@0ebf47130e4866e96fce0953f49152a61190b271 # v6.0.9

      - name: Setup Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 26
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Run unit tests with coverage
        run: pnpm run test:coverage

      - name: Check dependency version groups
        run: pnpm run deps:lint

  build:
    name: Build
    runs-on: ubuntu-latest
    timeout-minutes: 30
    # Dokploy builds from source on the deployment server, so nothing else
    # verifies that the app still compiles. This job replaces the check the
    # former GHCR image build provided: a PR that breaks the build fails here
    # rather than on the server at deploy time.
    #
    # Pull requests always build against Development, whatever they target.
    # GitHub evaluates an environment's deployment branch policy against the
    # run's own ref, and a PR's ref is `refs/pull/N/merge`, which is not a
    # branch. Production is restricted to `main`, so a PR selecting it is
    # rejected outright ("Branch is not allowed to deploy to Production").
    environment: ${{ github.event_name != 'pull_request' && github.ref_name == 'main' && 'Production' || 'Development' }}
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Setup pnpm
        uses: pnpm/action-setup@0ebf47130e4866e96fce0953f49152a61190b271 # v6.0.9

      - name: Setup Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 26
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      # generateStaticParams() calls payload.find() in six routes, so the build
      # needs a reachable database — the same reason the old image build joined
      # the tailnet before running.
      - name: Connect to Tailscale
        uses: tailscale/github-action@v4.1.3
        with:
          oauth-client-id: ${{ secrets.TS_OAUTH_CLIENT_ID }}
          oauth-secret: ${{ secrets.TS_OAUTH_SECRET }}
          tags: tag:ci

      - name: Build
        env:
          # Read by the prerender pass, mirroring buildTimeEnvKeys in
          # src/types/environment.ts.
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
          PAYLOAD_SECRET: ${{ secrets.PAYLOAD_SECRET }}
          REDIS_URL: ${{ secrets.REDIS_URL }}
          S3_BUCKET: ${{ vars.S3_BUCKET }}
          S3_REGION: ${{ vars.S3_REGION }}
          S3_ENDPOINT: ${{ vars.S3_ENDPOINT }}
          S3_ACCESS_KEY: ${{ secrets.S3_ACCESS_KEY }}
          S3_SECRET_KEY: ${{ secrets.S3_SECRET_KEY }}
          # Inlined into the client bundle and captured in the prerendered
          # shell, so they cannot be supplied at runtime. All three are public.
          SERVER_URL: ${{ vars.SERVER_URL }}
          STATUS_PAGE_URL: ${{ vars.STATUS_PAGE_URL }}
          SENTRY_DSN: ${{ vars.SENTRY_DSN }}
        # Fail loudly rather than baking `undefined` into the client bundle and
        # the prerendered robots.txt, which surfaces much later as a broken
        # status link, wrong canonical URLs, and `Sitemap: undefined/sitemap.xml`.
        run: |
          test -n "$SERVER_URL" || { echo "::error::SERVER_URL is required (inlined into the client bundle)" >&2; exit 1; }
          test -n "$STATUS_PAGE_URL" || { echo "::error::STATUS_PAGE_URL is required (inlined into the client bundle)" >&2; exit 1; }
          pnpm run build

  commits:
    name: Commit Messages
    # local hooks can be skipped with --no-verify, so PRs are checked here too
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          # commitlint needs the range between base and head
          fetch-depth: 0

      - name: Setup pnpm
        uses: pnpm/action-setup@0ebf47130e4866e96fce0953f49152a61190b271 # v6.0.9

      - name: Setup Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 26
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Validate commit messages
        run: >-
          pnpm exec commitlint
          --from ${{ github.event.pull_request.base.sha }}
          --to ${{ github.event.pull_request.head.sha }}
          --verbose
