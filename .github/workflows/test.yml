name: Test

# Tests run here rather than on the deployment server because they need a
# different environment than the build does — which is to say, none. The suite
# mocks `payload` and stubs its own env in vitest.setup.ts, so it needs no
# database, no tailnet and no secrets, and a clean runner proves it stays that
# way. The build is the opposite: generateStaticParams() reaches the database
# over Tailscale during static generation, so it stays on the deployment server
# where Dokploy already has that access.
#
# Running tests on a pull request also catches a failure before merge, whereas
# Dokploy only builds after a push to main/develop.
on:
  pull_request:
  push:
    branches:
      - main
      - develop

jobs:
  unit:
    name: Unit Tests
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Setup pnpm
        uses: pnpm/action-setup@0ebf47130e4866e96fce0953f49152a61190b271 # v6.0.9

      - name: Setup Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 26
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Run unit tests with coverage
        run: pnpm run test:coverage

      - name: Check dependency version groups
        run: pnpm run deps:lint
