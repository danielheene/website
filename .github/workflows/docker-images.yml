name: Docker Images

on:
  workflow_dispatch:
  push:
    branches:
      - main
      - develop
  pull_request:
    types: [opened, synchronize, reopened]
    branches:
      - main
      - develop

permissions:
  contents: read
  packages: write

jobs:
  build-web:
    runs-on: ubuntu-latest
    # Secrets and non-secret config are synced into these environments by the
    # Doppler GitHub App, so `secrets.*` / `vars.*` below resolve to the Doppler
    # config matching the branch. Selecting the environment here replaces the
    # former manual PROD_/DEVELOP_/PREVIEW_ secret-name juggling.
    #
    # `base_ref` is the PR's target branch and is set only on pull_request;
    # `ref_name` is the pushed branch. Coalescing them means a PR is judged by
    # what it would merge INTO, not by its own `refs/pull/N/merge` ref.
    environment: ${{ (github.base_ref || github.ref_name) == 'main' && 'Production' || 'Development' }}
    steps:
      - name: Checkout code repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@bb05f3f5519dd87d3ba754cc423b652a5edd6d2c # v4.2.0

      - name: Log in to GHCR
        uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Connect to Tailscale
        uses: tailscale/github-action@v4.1.3
        with:
          oauth-client-id: ${{ secrets.TS_OAUTH_CLIENT_ID }}
          oauth-secret: ${{ secrets.TS_OAUTH_SECRET }}
          tags: tag:ci

      - name: Compute image metadata
        id: meta
        uses: docker/metadata-action@v6
        with:
          images: ghcr.io/${{ github.repository }}/web
          tags: |
            type=sha,prefix=sha-,format=short
            type=ref,event=branch
            type=ref,event=pr
            type=raw,value=production,enable=${{ github.ref == 'refs/heads/main' }}
            type=raw,value=develop,enable=${{ github.ref == 'refs/heads/develop' }}
            type=raw,value=latest,enable=${{ github.ref == 'refs/heads/main' }}

      - name: Build and push web image
        uses: docker/build-push-action@v7
        with:
          context: .
          file: ./Dockerfile
          push: true
          # the build reaches the database over Tailscale during static generation
          network: host
          # Passed as BuildKit secrets: mounted only for the RUN that needs them
          # and never persisted into an image layer or the build cache.
          # next.config.ts validates the whole env schema before building, so
          # every required value must be present — but only DATABASE_URL is
          # actually used (generateStaticParams() queries Payload in six routes).
          secrets: |
            DATABASE_URL=${{ secrets.DATABASE_URL }}
            SENTRY_AUTH_TOKEN=${{ secrets.SENTRY_AUTH_TOKEN }}
            PAYLOAD_SECRET=${{ secrets.PAYLOAD_SECRET }}
            PREVIEW_SECRET=${{ secrets.PREVIEW_SECRET }}
            CRON_SECRET=${{ secrets.CRON_SECRET }}
            REDIS_URL=${{ secrets.REDIS_URL }}
            S3_ACCESS_KEY=${{ secrets.S3_ACCESS_KEY }}
            S3_SECRET_KEY=${{ secrets.S3_SECRET_KEY }}
            UMAMI_USERNAME=${{ secrets.UMAMI_USERNAME }}
            UMAMI_PASSWORD=${{ secrets.UMAMI_PASSWORD }}
            USESEND_API_KEY=${{ secrets.USESEND_API_KEY }}
            OPENAI_API_KEY=${{ secrets.OPENAI_API_KEY }}
            ANTHROPIC_API_KEY=${{ secrets.ANTHROPIC_API_KEY }}
            MAPBOX_API_KEY=${{ secrets.MAPBOX_API_KEY }}
          # Non-secret config. SERVER_URL / STATUS_PAGE_URL / SENTRY_DSN are
          # inlined into the client bundle by next.config.ts's `env:` block; the
          # rest only need to be present for schema validation and are supplied
          # again at runtime by Dokploy.
          build-args: |
            SERVER_URL=${{ vars.SERVER_URL }}
            SERVER_HOST=${{ vars.SERVER_HOST }}
            STATUS_PAGE_URL=${{ vars.STATUS_PAGE_URL }}
            STATUS_PAGE_HEARTBEAT_URL=${{ vars.STATUS_PAGE_HEARTBEAT_URL }}
            SENTRY_DSN=${{ vars.SENTRY_DSN }}
            S3_BUCKET=${{ vars.S3_BUCKET }}
            S3_REGION=${{ vars.S3_REGION }}
            S3_ENDPOINT=${{ vars.S3_ENDPOINT }}
            NEXT_PUBLIC_UMAMI_URL=${{ vars.NEXT_PUBLIC_UMAMI_URL }}
            NEXT_PUBLIC_UMAMI_SITE_ID=${{ vars.NEXT_PUBLIC_UMAMI_SITE_ID }}
            USESEND_URL=${{ vars.USESEND_URL }}
            USESEND_DEFAULT_FROM_ADDRESS=${{ vars.USESEND_DEFAULT_FROM_ADDRESS }}
            USESEND_DEFAULT_FROM_NAME=${{ vars.USESEND_DEFAULT_FROM_NAME }}
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}

  deploy:
    needs: [build-web]
    if: github.event_name == 'push' && (github.ref == 'refs/heads/main' || github.ref == 'refs/heads/develop')
    runs-on: ubuntu-latest
    # Same selector as build-web. This job is gated to pushes, so `base_ref` is
    # always empty here — it is kept identical so the two never drift apart.
    environment: ${{ (github.base_ref || github.ref_name) == 'main' && 'Production' || 'Development' }}
    steps:
      # One step for both branches: the environment selected above already
      # resolves DOKPLOY_WEBHOOK_URL to the right Doppler config, so there is no
      # need for per-branch steps with separate secret names.
      - name: Trigger Dokploy deploy
        env:
          WEBHOOK_URL: ${{ secrets.DOKPLOY_WEBHOOK_URL }}
        run: |
          if [ -z "$WEBHOOK_URL" ]; then
            echo "::error::DOKPLOY_WEBHOOK_URL is not set for this environment — add it in Doppler." >&2
            exit 1
          fi
          curl -fsS -X POST "$WEBHOOK_URL"
