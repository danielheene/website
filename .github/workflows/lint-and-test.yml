name: Lint & Test

# PR gate only. The checks themselves live in ci.yml, which build-and-deploy.yml
# also runs before shipping; nothing is built into an image or pushed here.
on:
  pull_request:
    branches:
      - main
      - develop

permissions:
  contents: read

# A newer push to the same PR supersedes the run in progress.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  ci:
    name: CI
    uses: ./.github/workflows/ci.yml
    permissions:
      contents: read
