name: Lint & Test

# PR gate only: lint + test. Nothing is built or pushed here — that's
# build-and-deploy.yml, triggered separately on push to main/develop.
on:
  pull_request:
    branches:
      - main
      - develop

# Both jobs only checkout, install, and run lint/tests — neither needs to
# write anything, so GITHUB_TOKEN is scoped down to read-only.
permissions:
  contents: read

# A newer push to the same PR supersedes the run in progress.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  lint:
    name: Lint
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          # commitlint needs the range between base and head
          fetch-depth: 0

      - name: Setup
        uses: ./.github/actions/setup

      - name: Validate commit messages
        run: >-
          pnpm exec commitlint
          --from ${{ github.event.pull_request.base.sha }}
          --to ${{ github.event.pull_request.head.sha }}
          --verbose

      - name: Lint
        run: pnpm run lint

      - name: Check dependency version groups
        run: pnpm run deps:lint

      # Generated files are committed; a stale one means someone changed a
      # collection/field/block without running `pnpm generate`.
      - name: Check generated files are up to date
        run: |
          # payload.config.ts reads the environment when it loads
          export $(grep -v '^#' .env.test | grep -v '^$' | xargs)
          pnpm run generate
          git diff --exit-code -- src/types/payload.ts "app/(payload)/admin/importMap.js"

      - name: Lint workflows
        run: docker run --rm -v "$PWD:/repo" -w /repo rhysd/actionlint:1.7.7 -color

  test:
    name: Unit Tests
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Setup
        uses: ./.github/actions/setup

      - name: Run unit tests with coverage
        run: pnpm run test:coverage

      - name: Upload coverage
        if: always()
        uses: actions/upload-artifact@v4 # TODO: pin to a commit SHA like the other actions
        with:
          name: coverage
          path: coverage/
          retention-days: 7
          if-no-files-found: ignore

  e2e:
    name: E2E Tests
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Setup
        uses: ./.github/actions/setup

      - name: Resolve Playwright version
        id: playwright
        run: echo "version=$(pnpm exec playwright --version | awk '{print $2}')" >> "$GITHUB_OUTPUT"

      - name: Cache Playwright browsers
        id: playwright-cache
        uses: actions/cache@v4 # TODO: pin to a commit SHA like the other actions
        with:
          path: ~/.cache/ms-playwright
          key: playwright-${{ runner.os }}-${{ steps.playwright.outputs.version }}

      - name: Install Playwright browsers
        if: steps.playwright-cache.outputs.cache-hit != 'true'
        run: pnpm exec playwright install --with-deps chromium

      - name: Install Playwright system dependencies
        if: steps.playwright-cache.outputs.cache-hit == 'true'
        run: pnpm exec playwright install-deps chromium

      # docker-compose.yml interpolates S3_ACCESS_KEY/S3_SECRET_KEY/S3_BUCKET
      # from the shell environment — .env.test is the single source of truth
      # for those (and for everything test:e2e itself loads via --env-file).
      - name: Load .env.test into job environment
        run: grep -v '^#' .env.test | grep -v '^$' >> "$GITHUB_ENV"

      - name: Start local services (Mongo, Redis, S3)
        run: docker compose up -d --wait

      # The smoke tests hit the CMS-driven homepage and admin login screen,
      # which need the schema and seed documents (e.g. the `home` page)
      # that 00000001_initialize_basic_site creates — without this the DB
      # is empty and every page-rendering assertion 404s.
      - name: Run database migrations
        run: pnpm run migrate

      # blog.spec.ts needs published posts. seed:posts creates its own topics,
      # and each post fetches one placeholder image from picsum.photos, so
      # the count stays small.
      - name: Seed blog content
        run: pnpm run seed:posts -- --count 2

      - name: Run E2E tests
        run: pnpm run test:e2e

      - name: Upload Playwright report
        if: failure()
        uses: actions/upload-artifact@v4 # TODO: pin to a commit SHA like the other actions
        with:
          name: playwright-report
          path: |
            playwright-report/
            test-results/
          retention-days: 7
          if-no-files-found: ignore
