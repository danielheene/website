name: Lint & Test

# PR gate only — required by branch protection before a PR can merge.
# build-and-deploy.yml assumes these checks already passed and does not
# re-run them; nothing here is built into an image or pushed.
on:
  pull_request:
    branches:
      - main
      - develop

permissions:
  contents: read

# A newer push to the same PR supersedes the run in progress.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
