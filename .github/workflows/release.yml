name: Release & Promote

# Combines what were two separate workflows (release.yml + promote.yml) into
# one, since promote's main-branch job only ever ran to consume release's
# output — same trigger, same commit, just chained via workflow_run before.
# Doing it as needs: within one workflow_run instead means promote-main reads
# the version straight from the release job's own output rather than
# re-checking-out main and re-deriving it, and drops the PR-lookup dance that
# used to recover the merge's head SHA from the GitHub API.
#
#   push to main -> release (semantic-release bumps + tags, maybe) ->
#                   promote-main (retag ci.yml's images as latest + version)
#
#   PR merged into develop -> promote-develop (retag ci.yml's images as edge)
#
# promote-develop is unrelated to the release/version flow (develop never
# gets a semver tag), so it stays keyed off pull_request: closed exactly as
# it was in promote.yml, just living in this same file now.
#
# workflow_dispatch lets either promote job be re-run standalone — no fresh
# release or merge required — to re-promote (retag + redeploy) an already
# built, already ci.yml-pushed image, e.g. for a rollback or to recover from
# a webhook that failed partway. source_sha is the ghcr.io sha-<sha> tag to
# promote from; it skips release entirely, so there's no version to read —
# a manual promote-main run only retags :latest, never :vX.Y.Z.
#
# Which environment gets promoted is decided by the branch the dispatch is
# run from (GitHub's own "Use workflow from" picker) rather than a separate
# input — github.ref_name == 'main' -> promote-main, == 'develop' ->
# promote-develop. There's no third choice to offer, so the branch already
# says everything a target input would.
on:
  push:
    branches:
      - main
  pull_request:
    types: [closed]
    branches:
      - develop
  workflow_dispatch:
    inputs:
      source_sha:
        description: 'Commit SHA of the already-built ghcr.io images to promote (sha-<this> tag)'
        required: true
        type: string

# release needs to push a commit/tag and create a GitHub release;
# promote-main/promote-develop only retag existing ghcr.io images.
permissions:
  contents: write
  packages: write

env:
  REGISTRY: ghcr.io
  IMAGE_BASE: ghcr.io/${{ github.repository }}

jobs:
  release:
    name: Release
    # Only runs on the actual push-to-main trigger — workflow_dispatch is a
    # standalone re-promote of already-built images, nothing to release.
    if: >-
      github.event_name == 'push' &&
      !contains(github.event.head_commit.message, '[skip ci]')
    runs-on: ubuntu-latest
    timeout-minutes: 10
    outputs:
      released: ${{ steps.release.outputs.released }}
      version: ${{ steps.release.outputs.version }}
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          # semantic-release computes the next version from the full commit
          # history since the last tag — a shallow clone would see nothing.
          fetch-depth: 0
          persist-credentials: true

      - name: Setup pnpm
        uses: pnpm/action-setup@0ebf47130e4866e96fce0953f49152a61190b271 # v6.0.9

      - name: Setup Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 26
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Release
        id: release
        run: |
          pnpm exec semantic-release
          # Nothing to promote if this push didn't actually cut a release
          # (e.g. a docs/chore-only push that semantic-release skipped) —
          # semantic-release's own commit (if any) is HEAD after it runs,
          # so an exact tag match there means a release was just cut.
          if git describe --tags --exact-match HEAD >/dev/null 2>&1; then
            echo "released=true" >> "$GITHUB_OUTPUT"
            echo "version=v$(node -p 'require("./package.json").version')" >> "$GITHUB_OUTPUT"
          else
            echo "released=false" >> "$GITHUB_OUTPUT"
          fi
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  promote-main:
    name: Promote images to latest + release version
    needs: release
    # needs: release alone would skip this job whenever release is skipped
    # ([skip ci] pushes, e.g. semantic-release's own commit re-triggering
    # this workflow, or a workflow_dispatch run where release doesn't run at
    # all) — a skipped dependency fails needs's implicit success() check just
    # like a failed one. always() plus an explicit failure()/cancelled()
    # check is what actually lets this job evaluate its own conditions
    # instead of never running at all.
    #
    # Two independent ways in:
    #   - push (the normal path): only once release actually cut a release.
    #   - workflow_dispatch run from main: a standalone re-promote of an
    #     already-built image, no release involved at all.
    if: >-
      always() && !contains(needs.release.result, 'failure') && !contains(needs.release.result, 'cancelled') &&
      ((github.event_name == 'push' && needs.release.outputs.released == 'true') ||
       (github.event_name == 'workflow_dispatch' && github.ref_name == 'main'))
    runs-on: ubuntu-latest
    timeout-minutes: 10
    # Scopes DEPLOY_WEBHOOK_URL to this environment's own secret, same
    # pattern ci.yml's docker-app-production job uses for its secrets.
    environment: Production
    steps:
      # The push commit on main is not the SHA ci.yml built for this PR (see
      # this workflow's own release job: semantic-release pushes its own
      # commit on top) — the merged PR is looked up to recover the head SHA
      # the images were actually tagged with. Skipped on workflow_dispatch,
      # which already has the SHA to promote from as an explicit input.
      - name: Find source PR head SHA
        if: github.event_name == 'push'
        id: pr
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          merge_sha="${{ github.sha }}"
          head_sha=$(gh pr list --repo "${{ github.repository }}" --state merged \
            --search "$merge_sha" --json headRefOid --jq '.[0].headRefOid')
          if [ -z "$head_sha" ] || [ "$head_sha" = "null" ]; then
            echo "Could not resolve the source PR's head SHA for $merge_sha" >&2
            exit 1
          fi
          echo "head_sha=$head_sha" >> "$GITHUB_OUTPUT"

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@e468171a9de216ec08956ac3ada2f0791b6bd435 # v3.11.1

      - name: Log in to ghcr.io
        uses: docker/login-action@5e57cd118135c172c3672efd75eb46360885c0ef # v3.6.0
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      # On workflow_dispatch there's no release, so no version to tag with —
      # only :latest is applied; the normal push path still gets :vX.Y.Z too.
      - name: Retag app/worker/storybook as latest (+ version if released)
        env:
          HEAD_SHA: ${{ github.event_name == 'workflow_dispatch' && github.event.inputs.source_sha || steps.pr.outputs.head_sha }}
          VERSION: ${{ needs.release.outputs.version }}
        run: |
          for image in app worker storybook; do
            tags=(--tag "${IMAGE_BASE}-${image}:latest")
            if [ -n "$VERSION" ]; then
              tags+=(--tag "${IMAGE_BASE}-${image}:${VERSION}")
            fi
            docker buildx imagetools create "${tags[@]}" "${IMAGE_BASE}-${image}:sha-${HEAD_SHA}"
          done

      # Tells Dokploy to actually redeploy each Production app now that its
      # image is retagged — retagging ghcr.io alone doesn't make Dokploy pull
      # it. Each URL already embeds its own auth (Dokploy's refreshToken as a
      # query param), so these are just bare trigger calls, one per app.
      - name: Trigger Dokploy deployments
        run: |
          for url in "$DOKPLOY_UPDATE_URL_APP" "$DOKPLOY_UPDATE_URL_WORKER" "$DOKPLOY_UPDATE_URL_STORYBOOK"; do
            curl --fail --silent --show-error --request POST "$url"
          done
        env:
          DOKPLOY_UPDATE_URL_APP: ${{ secrets.DOKPLOY_UPDATE_URL_APP }}
          DOKPLOY_UPDATE_URL_WORKER: ${{ secrets.DOKPLOY_UPDATE_URL_WORKER }}
          DOKPLOY_UPDATE_URL_STORYBOOK: ${{ secrets.DOKPLOY_UPDATE_URL_STORYBOOK }}

  promote-develop:
    name: Promote images to edge
    # Two independent ways in: the normal PR-merge path, or workflow_dispatch
    # run from develop — a standalone re-promote of an already-built image,
    # e.g. a rollback, no merge required.
    if: >-
      (github.event_name == 'pull_request' &&
       github.event.pull_request.merged == true &&
       github.event.pull_request.base.ref == 'develop') ||
      (github.event_name == 'workflow_dispatch' && github.ref_name == 'develop')
    runs-on: ubuntu-latest
    timeout-minutes: 10
    # Scopes DEPLOY_WEBHOOK_URL to this environment's own secret, same
    # pattern ci.yml's docker-app-development job uses for its secrets.
    environment: Development
    steps:
      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@e468171a9de216ec08956ac3ada2f0791b6bd435 # v3.11.1

      - name: Log in to ghcr.io
        uses: docker/login-action@5e57cd118135c172c3672efd75eb46360885c0ef # v3.6.0
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Retag app/worker/storybook as edge
        env:
          HEAD_SHA: ${{ github.event_name == 'workflow_dispatch' && github.event.inputs.source_sha || github.event.pull_request.head.sha }}
        run: |
          for image in app worker storybook; do
            docker buildx imagetools create \
              --tag "${IMAGE_BASE}-${image}:edge" \
              "${IMAGE_BASE}-${image}:sha-${HEAD_SHA}"
          done

      # Tells Dokploy to actually redeploy each Development app now that its
      # image is retagged — see promote-main's identical step for why this
      # is needed at all.
      - name: Trigger Dokploy deployments
        run: |
          for url in "$DOKPLOY_UPDATE_URL_APP" "$DOKPLOY_UPDATE_URL_WORKER" "$DOKPLOY_UPDATE_URL_STORYBOOK"; do
            curl --fail --silent --show-error --request POST "$url"
          done
        env:
          DOKPLOY_UPDATE_URL_APP: ${{ secrets.DOKPLOY_UPDATE_URL_APP }}
          DOKPLOY_UPDATE_URL_WORKER: ${{ secrets.DOKPLOY_UPDATE_URL_WORKER }}
          DOKPLOY_UPDATE_URL_STORYBOOK: ${{ secrets.DOKPLOY_UPDATE_URL_STORYBOOK }}
