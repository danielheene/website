name: CI

# Single pipelined quality gate for PRs against main/develop:
#
#   commitlint -> unit tests -> docker build & push (app+worker, storybook)
#
# Each stage only runs once the previous one passes, and the whole run is
# what branch protection requires before a PR can be merged — "stable code
# only" is enforced here, not just checked and ignored.
#
# The app+worker build is split into docker-app-development/docker-app-
# production rather than one job with a computed `environment:` — GitHub
# accepts `environment: ${{ expression }}` syntactically but does not
# reliably bind an environment from it (confirmed: the job ran with no
# environment bound at all, so no secrets were injected). Each variant is
# gated by `if:` on the PR's base branch and uses a static, literal
# environment name instead.
#
# Images are tagged solely by the PR head SHA (`sha-<head_sha>`) and pushed to
# ghcr.io. Nothing is retagged as a release version here: on merge,
# promote.yml retags this exact already-built image instead of rebuilding —
# see that workflow for why.
#
# Each image is built for both linux/amd64 and linux/arm64 on native runners
# (ubuntu-latest / ubuntu-24.04-arm) rather than via QEMU emulation — the
# app/worker build runs `next build` against a real database over Tailscale
# during generateStaticParams, and emulating that leg would be slow and
# flaky. Each arch leg of a `docker-app-*`/`docker-storybook` matrix job
# pushes its own `sha-<sha>-amd64`/`sha-<sha>-arm64` tag (two parallel jobs
# can't safely push the same tag), and the matching `*-merge` job combines
# them into the real `sha-<sha>` multi-arch manifest list via
# `docker buildx imagetools create` once both legs succeed. Everything
# downstream (release.yml's promote jobs) only ever reads that merged
# `sha-<sha>` tag, so it needs no changes to stay multi-arch-aware.
on:
  workflow_dispatch:
    inputs:
      skip_commitlint:
        description: 'Skip commitlint'
        required: true
        type: boolean
        default: true
      skip_tests:
        description: 'Skip tests'
        required: true
        type: boolean
        default: true
      environment:
        description: 'Environment'
        required: true
        default: 'development'
        type: choice
        options:
          - development
          - production
  pull_request:
    branches:
      - main
      - develop

permissions:
  contents: read
  packages: write
  # dispatch-release needs this to trigger release.yml via `gh workflow run`.
  actions: write

env:
  REGISTRY: ghcr.io
  IMAGE_BASE: ghcr.io/${{ github.repository }}
  # github.event.pull_request.head.sha only exists on the pull_request
  # trigger — it's unset on workflow_dispatch, where github.sha (the
  # selected branch's tip) is the actual commit being built instead.
  BUILD_SHA: ${{ github.event.pull_request.head.sha || github.sha }}

jobs:
  commitlint:
    name: Commit Messages
    if: github.event.inputs.skip_commitlint != 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          # commitlint needs the range between base and head
          fetch-depth: 0

      - name: Setup pnpm
        uses: pnpm/action-setup@0ebf47130e4866e96fce0953f49152a61190b271 # v6.0.9

      - name: Setup Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 26
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Validate commit messages
        run: >-
          pnpm exec commitlint
          --from ${{ github.event.pull_request.base.sha }}
          --to ${{ github.event.pull_request.head.sha }}
          --verbose

  test:
    name: Unit Tests
    needs: commitlint
    # needs: commitlint alone would skip this job whenever commitlint is
    # skipped (its default on workflow_dispatch) — a skipped dependency
    # fails needs's implicit success() check just like a failed one. always()
    # plus an explicit failure()/cancelled() check is what actually lets this
    # job run when commitlint was intentionally skipped rather than failed.
    if: always() && !contains(needs.commitlint.result, 'failure') && !contains(needs.commitlint.result, 'cancelled') && github.event.inputs.skip_tests != 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Setup pnpm
        uses: pnpm/action-setup@0ebf47130e4866e96fce0953f49152a61190b271 # v6.0.9

      - name: Setup Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 26
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Run unit tests with coverage
        run: pnpm run test:coverage

      - name: Check dependency version groups
        run: pnpm run deps:lint

  # Split into two explicit jobs rather than one job with a computed
  # `environment: ${{ ... }}` expression: GitHub accepted that expression
  # syntactically but never actually bound any environment to the job (its
  # API response showed `environment: null`), so no environment-scoped
  # secrets were ever injected. A static, literal environment name per job
  # is the documented, reliable form.
  docker-app-development:
    name: Build app + worker images (Development)
    needs: test
    # Same needs-vs-skip issue as test's own if: above — test being skipped
    # (skip_tests default on workflow_dispatch) must not cascade into
    # skipping the build too, only an actual test failure/cancellation should.
    if: |
      always() && !contains(needs.test.result, 'failure') && !contains(needs.test.result, 'cancelled') &&
      (github.event.pull_request.base.ref == 'develop' || github.event.inputs.environment == 'development')
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 30
    environment: Development
    strategy:
      matrix:
        include:
          - arch: amd64
            runner: ubuntu-latest
          - arch: arm64
            runner: ubuntu-24.04-arm
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      # Reaches the same database over Tailscale that Dokploy currently does,
      # so `pnpm run build`'s generateStaticParams() calls resolve exactly as
      # they do on the deployment server today. DATABASE_URL/REDIS_URL use a
      # MagicDNS hostname (dokploy.robin-marlin.ts.net) rather than a raw
      # tailnet IP, so this node needs to actually accept the tailnet's DNS
      # config — --accept-dns=true is `tailscale up`'s own default, but is
      # made explicit here since a prior run hit `getaddrinfo ENOTFOUND` for
      # that hostname despite the tailnet join itself succeeding. If this
      # alone doesn't resolve it, MagicDNS itself may need enabling tailnet-
      # wide in the Tailscale admin console's DNS settings.
      - name: Connect to Tailscale
        uses: tailscale/github-action@780049a30b6ff5c378a9e7b389d15ece7a204888 # v4.1.3
        with:
          oauth-client-id: ${{ secrets.TS_OAUTH_CLIENT_ID }}
          oauth-secret: ${{ secrets.TS_OAUTH_SECRET }}
          tags: tag:ci
          args: --accept-dns=true

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@e468171a9de216ec08956ac3ada2f0791b6bd435 # v3.11.1

      - name: Log in to ghcr.io
        uses: docker/login-action@5e57cd118135c172c3672efd75eb46360885c0ef # v3.6.0
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      # Every build-time env var the Next.js build needs (per
      # src/types/environment.ts) is written to one gitignored-by-runner file
      # in dotenv format and mounted into the builder stage as a single
      # BuildKit secret — see the Dockerfile's `builder` stage, which copies
      # it to .env.production and lets @next/env's own dotenv parser read it
      # (not shell-sourced — see that stage's comment for why). Nothing here
      # is ARG/ENV, so no value is cached into an image layer or visible via
      # `docker history`. Values come from whichever environment was
      # selected above — some are Doppler secrets, some are plain
      # Doppler-synced variables (vars.*); both land in the same file since
      # the build doesn't need to distinguish them.
      - name: Write build env secret file
        run: |
          umask 077
          cat > /tmp/build_env <<EOF
          SERVER_HOST=${{ vars.SERVER_HOST }}
          SERVER_URL=${{ vars.SERVER_URL }}
          STATUS_PAGE_URL=${{ vars.STATUS_PAGE_URL }}
          STATUS_PAGE_HEARTBEAT_URL=${{ vars.STATUS_PAGE_HEARTBEAT_URL }}
          PAYLOAD_SECRET=${{ secrets.PAYLOAD_SECRET }}
          PREVIEW_SECRET=${{ secrets.PREVIEW_SECRET }}
          CRON_SECRET=${{ secrets.CRON_SECRET }}
          DATABASE_URL=${{ secrets.DATABASE_URL }}
          REDIS_URL=${{ secrets.REDIS_URL }}
          S3_BUCKET=${{ vars.S3_BUCKET }}
          S3_SECRET_KEY=${{ secrets.S3_SECRET_KEY }}
          S3_REGION=${{ vars.S3_REGION }}
          S3_ACCESS_KEY=${{ secrets.S3_ACCESS_KEY }}
          S3_ENDPOINT=${{ vars.S3_ENDPOINT }}
          UMAMI_USERNAME=${{ secrets.UMAMI_USERNAME }}
          UMAMI_PASSWORD=${{ secrets.UMAMI_PASSWORD }}
          NEXT_PUBLIC_UMAMI_URL=${{ vars.NEXT_PUBLIC_UMAMI_URL }}
          NEXT_PUBLIC_UMAMI_SITE_ID=${{ vars.NEXT_PUBLIC_UMAMI_SITE_ID }}
          USESEND_URL=${{ vars.USESEND_URL }}
          USESEND_API_KEY=${{ secrets.USESEND_API_KEY }}
          USESEND_DEFAULT_FROM_ADDRESS=${{ vars.USESEND_DEFAULT_FROM_ADDRESS }}
          USESEND_DEFAULT_FROM_NAME=${{ vars.USESEND_DEFAULT_FROM_NAME }}
          OPENAI_API_KEY=${{ secrets.OPENAI_API_KEY }}
          ANTHROPIC_API_KEY=${{ secrets.ANTHROPIC_API_KEY }}
          MAPBOX_API_KEY=${{ secrets.MAPBOX_API_KEY }}
          EOF

      # NODE_ENV=development here (Dockerfile defaults to production
      # otherwise) — this job only builds for PRs against develop, so its
      # images should reflect a development environment.
      #
      # Each arch in the matrix pushes its own arch-suffixed tag rather than
      # a shared one — two parallel jobs pushing the same tag would race and
      # clobber each other. The merge job below combines
      # sha-<sha>-amd64/-arm64 into the real sha-<sha> multi-arch manifest
      # list once both legs finish.
      - name: Build & push app image
        uses: docker/build-push-action@263435318d21b8e681c14492fe198d362a7d2c83 # v6.18.0
        with:
          context: .
          target: app
          push: true
          tags: ${{ env.IMAGE_BASE }}-app:sha-${{ env.BUILD_SHA }}-${{ matrix.arch }}
          build-args: |
            NODE_ENV=development
          cache-from: type=gha,scope=app-${{ matrix.arch }}
          cache-to: type=gha,mode=max,scope=app-${{ matrix.arch }}
          secret-files: |
            build_env=/tmp/build_env

      # The builder stage (with .next already built) is reused verbatim for
      # the worker target via Docker's layer cache — this does not re-run
      # `pnpm run build`.
      - name: Build & push worker image
        uses: docker/build-push-action@263435318d21b8e681c14492fe198d362a7d2c83 # v6.18.0
        with:
          context: .
          target: worker
          push: true
          tags: ${{ env.IMAGE_BASE }}-worker:sha-${{ env.BUILD_SHA }}-${{ matrix.arch }}
          build-args: |
            NODE_ENV=development
          cache-from: type=gha,scope=app-${{ matrix.arch }}
          cache-to: type=gha,mode=max,scope=app-${{ matrix.arch }}
          secret-files: |
            build_env=/tmp/build_env

  docker-app-development-merge:
    name: Merge app + worker images (Development)
    needs: docker-app-development
    if: always() && needs.docker-app-development.result == 'success'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    environment: Development
    steps:
      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@e468171a9de216ec08956ac3ada2f0791b6bd435 # v3.11.1

      - name: Log in to ghcr.io
        uses: docker/login-action@5e57cd118135c172c3672efd75eb46360885c0ef # v3.6.0
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Create multi-arch manifest lists
        run: |
          for image in app worker; do
            docker buildx imagetools create \
              --tag "${IMAGE_BASE}-${image}:sha-${BUILD_SHA}" \
              "${IMAGE_BASE}-${image}:sha-${BUILD_SHA}-amd64" \
              "${IMAGE_BASE}-${image}:sha-${BUILD_SHA}-arm64"
          done

  docker-app-production:
    name: Build app + worker images (Production)
    needs: test
    # Same needs-vs-skip issue as docker-app-development's if: above.
    if: |
      always() && !contains(needs.test.result, 'failure') && !contains(needs.test.result, 'cancelled') &&
      (github.event.pull_request.base.ref == 'main' || github.event.inputs.environment == 'production')
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 30
    environment: Production
    strategy:
      matrix:
        include:
          - arch: amd64
            runner: ubuntu-latest
          - arch: arm64
            runner: ubuntu-24.04-arm
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      # Reaches the same database over Tailscale that Dokploy currently does,
      # so `pnpm run build`'s generateStaticParams() calls resolve exactly as
      # they do on the deployment server today. DATABASE_URL/REDIS_URL use a
      # MagicDNS hostname (dokploy.robin-marlin.ts.net) rather than a raw
      # tailnet IP, so this node needs to actually accept the tailnet's DNS
      # config — --accept-dns=true is `tailscale up`'s own default, but is
      # made explicit here since a prior run hit `getaddrinfo ENOTFOUND` for
      # that hostname despite the tailnet join itself succeeding. If this
      # alone doesn't resolve it, MagicDNS itself may need enabling tailnet-
      # wide in the Tailscale admin console's DNS settings.
      - name: Connect to Tailscale
        uses: tailscale/github-action@780049a30b6ff5c378a9e7b389d15ece7a204888 # v4.1.3
        with:
          oauth-client-id: ${{ secrets.TS_OAUTH_CLIENT_ID }}
          oauth-secret: ${{ secrets.TS_OAUTH_SECRET }}
          tags: tag:ci
          args: --accept-dns=true

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@e468171a9de216ec08956ac3ada2f0791b6bd435 # v3.11.1

      - name: Log in to ghcr.io
        uses: docker/login-action@5e57cd118135c172c3672efd75eb46360885c0ef # v3.6.0
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      # See docker-app-development's identical step for why this file
      # exists and how it's consumed.
      - name: Write build env secret file
        run: |
          umask 077
          cat > /tmp/build_env <<EOF
          SERVER_HOST=${{ vars.SERVER_HOST }}
          SERVER_URL=${{ vars.SERVER_URL }}
          STATUS_PAGE_URL=${{ vars.STATUS_PAGE_URL }}
          STATUS_PAGE_HEARTBEAT_URL=${{ vars.STATUS_PAGE_HEARTBEAT_URL }}
          PAYLOAD_SECRET=${{ secrets.PAYLOAD_SECRET }}
          PREVIEW_SECRET=${{ secrets.PREVIEW_SECRET }}
          CRON_SECRET=${{ secrets.CRON_SECRET }}
          DATABASE_URL=${{ secrets.DATABASE_URL }}
          REDIS_URL=${{ secrets.REDIS_URL }}
          S3_BUCKET=${{ vars.S3_BUCKET }}
          S3_SECRET_KEY=${{ secrets.S3_SECRET_KEY }}
          S3_REGION=${{ vars.S3_REGION }}
          S3_ACCESS_KEY=${{ secrets.S3_ACCESS_KEY }}
          S3_ENDPOINT=${{ vars.S3_ENDPOINT }}
          UMAMI_USERNAME=${{ secrets.UMAMI_USERNAME }}
          UMAMI_PASSWORD=${{ secrets.UMAMI_PASSWORD }}
          NEXT_PUBLIC_UMAMI_URL=${{ vars.NEXT_PUBLIC_UMAMI_URL }}
          NEXT_PUBLIC_UMAMI_SITE_ID=${{ vars.NEXT_PUBLIC_UMAMI_SITE_ID }}
          USESEND_URL=${{ vars.USESEND_URL }}
          USESEND_API_KEY=${{ secrets.USESEND_API_KEY }}
          USESEND_DEFAULT_FROM_ADDRESS=${{ vars.USESEND_DEFAULT_FROM_ADDRESS }}
          USESEND_DEFAULT_FROM_NAME=${{ vars.USESEND_DEFAULT_FROM_NAME }}
          OPENAI_API_KEY=${{ secrets.OPENAI_API_KEY }}
          ANTHROPIC_API_KEY=${{ secrets.ANTHROPIC_API_KEY }}
          MAPBOX_API_KEY=${{ secrets.MAPBOX_API_KEY }}
          EOF

      # See docker-app-development's identical step for why each arch pushes
      # its own tag rather than a shared one.
      - name: Build & push app image
        uses: docker/build-push-action@263435318d21b8e681c14492fe198d362a7d2c83 # v6.18.0
        with:
          context: .
          target: app
          push: true
          tags: ${{ env.IMAGE_BASE }}-app:sha-${{ env.BUILD_SHA }}-${{ matrix.arch }}
          cache-from: type=gha,scope=app-${{ matrix.arch }}
          cache-to: type=gha,mode=max,scope=app-${{ matrix.arch }}
          secret-files: |
            build_env=/tmp/build_env

      # The builder stage (with .next already built) is reused verbatim for
      # the worker target via Docker's layer cache — this does not re-run
      # `pnpm run build`.
      - name: Build & push worker image
        uses: docker/build-push-action@263435318d21b8e681c14492fe198d362a7d2c83 # v6.18.0
        with:
          context: .
          target: worker
          push: true
          tags: ${{ env.IMAGE_BASE }}-worker:sha-${{ env.BUILD_SHA }}-${{ matrix.arch }}
          cache-from: type=gha,scope=app-${{ matrix.arch }}
          cache-to: type=gha,mode=max,scope=app-${{ matrix.arch }}
          secret-files: |
            build_env=/tmp/build_env

  docker-app-production-merge:
    name: Merge app + worker images (Production)
    needs: docker-app-production
    if: always() && needs.docker-app-production.result == 'success'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    environment: Production
    steps:
      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@e468171a9de216ec08956ac3ada2f0791b6bd435 # v3.11.1

      - name: Log in to ghcr.io
        uses: docker/login-action@5e57cd118135c172c3672efd75eb46360885c0ef # v3.6.0
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Create multi-arch manifest lists
        run: |
          for image in app worker; do
            docker buildx imagetools create \
              --tag "${IMAGE_BASE}-${image}:sha-${BUILD_SHA}" \
              "${IMAGE_BASE}-${image}:sha-${BUILD_SHA}-amd64" \
              "${IMAGE_BASE}-${image}:sha-${BUILD_SHA}-arm64"
          done

  docker-storybook:
    name: Build storybook image
    needs: test
    # Same needs-vs-skip issue as docker-app-development's if: above.
    if: always() && !contains(needs.test.result, 'failure') && !contains(needs.test.result, 'cancelled')
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 20
    strategy:
      matrix:
        include:
          - arch: amd64
            runner: ubuntu-latest
          - arch: arm64
            runner: ubuntu-24.04-arm
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@e468171a9de216ec08956ac3ada2f0791b6bd435 # v3.11.1

      - name: Log in to ghcr.io
        uses: docker/login-action@5e57cd118135c172c3672efd75eb46360885c0ef # v3.6.0
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      # See docker-app-development's identical step for why each arch pushes
      # its own tag rather than a shared one.
      - name: Build & push storybook image
        uses: docker/build-push-action@263435318d21b8e681c14492fe198d362a7d2c83 # v6.18.0
        with:
          context: .
          target: storybook
          push: true
          tags: ${{ env.IMAGE_BASE }}-storybook:sha-${{ env.BUILD_SHA }}-${{ matrix.arch }}
          cache-from: type=gha,scope=storybook-${{ matrix.arch }}
          cache-to: type=gha,mode=max,scope=storybook-${{ matrix.arch }}

  docker-storybook-merge:
    name: Merge storybook image
    needs: docker-storybook
    if: always() && needs.docker-storybook.result == 'success'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@e468171a9de216ec08956ac3ada2f0791b6bd435 # v3.11.1

      - name: Log in to ghcr.io
        uses: docker/login-action@5e57cd118135c172c3672efd75eb46360885c0ef # v3.6.0
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Create multi-arch manifest list
        run: |
          docker buildx imagetools create \
            --tag "${IMAGE_BASE}-storybook:sha-${BUILD_SHA}" \
            "${IMAGE_BASE}-storybook:sha-${BUILD_SHA}-amd64" \
            "${IMAGE_BASE}-storybook:sha-${BUILD_SHA}-arm64"

  # Manual dispatches build images but never promote/deploy them on their
  # own (unlike pull_request, which gets promoted downstream via merge +
  # release.yml). This closes that gap by dispatching release.yml's own
  # workflow_dispatch right after a manual ci.yml run finishes, on the same
  # branch and commit that were just built — release.yml's promote-main/
  # promote-develop jobs then retag+redeploy that exact image, deciding
  # which one applies from the branch (github.ref_name) same as any other
  # manual promotion.
  dispatch-release:
    name: Dispatch release workflow
    # Depends on the *-merge jobs, not the raw matrix builds directly — those
    # merge jobs are what actually produce the final sha-<sha> multi-arch
    # tag that release.yml's promote jobs retag from.
    needs: [docker-app-development-merge, docker-app-production-merge, docker-storybook-merge]
    # Only one of docker-app-development/docker-app-production actually runs
    # per invocation (mutually exclusive by environment input) — the other
    # is skipped by design, not failed, so this can't require both to
    # succeed. always() plus explicit failure()/cancelled() checks on each
    # is what lets this evaluate correctly instead of the cascade-skip
    # pattern seen elsewhere in this file.
    if: |
      always() && github.event_name == 'workflow_dispatch' &&
      !contains(needs.docker-app-development-merge.result, 'failure') && !contains(needs.docker-app-development-merge.result, 'cancelled') &&
      !contains(needs.docker-app-production-merge.result, 'failure') && !contains(needs.docker-app-production-merge.result, 'cancelled') &&
      !contains(needs.docker-storybook-merge.result, 'failure') && !contains(needs.docker-storybook-merge.result, 'cancelled')
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Dispatch release.yml
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh workflow run release.yml \
            --repo "${{ github.repository }}" \
            --ref "${{ github.ref_name }}" \
            -f source_sha="${{ env.BUILD_SHA }}"
