name: CI

# Single pipelined quality gate for PRs against main/develop:
#
#   commitlint -> unit tests -> docker build & push (app+worker, storybook)
#
# Each stage only runs once the previous one passes, and the whole run is
# what branch protection requires before a PR can be merged — "stable code
# only" is enforced here, not just checked and ignored.
#
# The app+worker build is split into docker-app-development/docker-app-
# production rather than one job with a computed `environment:` — GitHub
# accepts `environment: ${{ expression }}` syntactically but does not
# reliably bind an environment from it (confirmed: the job ran with no
# environment bound at all, so no Doppler-synced secrets/vars were
# injected). Each variant is gated by `if:` on the PR's base branch and uses
# a static, literal environment name instead.
#
# Images are tagged solely by the PR head SHA (`sha-<head_sha>`) and pushed to
# ghcr.io. Nothing is retagged as a release version here: on merge,
# promote.yml retags this exact already-built image instead of rebuilding —
# see that workflow for why.
on:
  pull_request:
    branches:
      - main
      - develop

permissions:
  contents: read
  packages: write

env:
  REGISTRY: ghcr.io
  IMAGE_BASE: ghcr.io/${{ github.repository }}

jobs:
  commitlint:
    name: Commit Messages
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          # commitlint needs the range between base and head
          fetch-depth: 0

      - name: Setup pnpm
        uses: pnpm/action-setup@0ebf47130e4866e96fce0953f49152a61190b271 # v6.0.9

      - name: Setup Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 26
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Validate commit messages
        run: >-
          pnpm exec commitlint
          --from ${{ github.event.pull_request.base.sha }}
          --to ${{ github.event.pull_request.head.sha }}
          --verbose

  test:
    name: Unit Tests
    needs: commitlint
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Setup pnpm
        uses: pnpm/action-setup@0ebf47130e4866e96fce0953f49152a61190b271 # v6.0.9

      - name: Setup Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 26
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Run unit tests with coverage
        run: pnpm run test:coverage

      - name: Check dependency version groups
        run: pnpm run deps:lint

  # Split into two explicit jobs rather than one job with a computed
  # `environment: ${{ ... }}` expression: GitHub accepted that expression
  # syntactically but never actually bound any environment to the job (its
  # API response showed `environment: null`), so no Doppler-synced
  # secrets/vars were ever injected and the build failed on a missing
  # DATABASE_URL. A static, literal environment name per job is the
  # documented, reliable form.
  docker-app-development:
    name: Build app + worker images (Development)
    needs: test
    if: github.event.pull_request.base.ref != 'main'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    environment: Development
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      # Reaches the same database over Tailscale that Dokploy currently does,
      # so `pnpm run build`'s generateStaticParams() calls resolve exactly as
      # they do on the deployment server today.
      - name: Connect to Tailscale
        uses: tailscale/github-action@780049a30b6ff5c378a9e7b389d15ece7a204888 # v4.1.3
        with:
          oauth-client-id: ${{ secrets.TS_OAUTH_CLIENT_ID }}
          oauth-secret: ${{ secrets.TS_OAUTH_SECRET }}
          tags: tag:ci

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@e468171a9de216ec08956ac3ada2f0791b6bd435 # v3.11.1

      - name: Log in to ghcr.io
        uses: docker/login-action@5e57cd118135c172c3672efd75eb46360885c0ef # v3.6.0
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      # Every build-time env var the Next.js build needs (per
      # src/types/environment.ts) is written to one gitignored-by-runner file
      # and mounted into the builder stage as a single BuildKit secret — see
      # the Dockerfile's `builder` stage. Nothing here is ARG/ENV, so no value
      # is cached into an image layer or visible via `docker history`. Values
      # come from whichever environment was selected above — some are Doppler
      # secrets, some are plain Doppler-synced variables (vars.*); both land
      # in the same file since the build doesn't need to distinguish them.
      - name: Write build env secret file
        run: |
          umask 077
          cat > /tmp/build_env <<EOF
          SERVER_HOST=${{ vars.SERVER_HOST }}
          SERVER_URL=${{ vars.SERVER_URL }}
          STATUS_PAGE_URL=${{ vars.STATUS_PAGE_URL }}
          STATUS_PAGE_HEARTBEAT_URL=${{ vars.STATUS_PAGE_HEARTBEAT_URL }}
          PAYLOAD_SECRET=${{ secrets.PAYLOAD_SECRET }}
          PREVIEW_SECRET=${{ secrets.PREVIEW_SECRET }}
          CRON_SECRET=${{ secrets.CRON_SECRET }}
          DATABASE_URL=${{ secrets.DATABASE_URL }}
          REDIS_URL=${{ secrets.REDIS_URL }}
          S3_BUCKET=${{ vars.S3_BUCKET }}
          S3_SECRET_KEY=${{ secrets.S3_SECRET_KEY }}
          S3_REGION=${{ vars.S3_REGION }}
          S3_ACCESS_KEY=${{ secrets.S3_ACCESS_KEY }}
          S3_ENDPOINT=${{ vars.S3_ENDPOINT }}
          UMAMI_USERNAME=${{ secrets.UMAMI_USERNAME }}
          UMAMI_PASSWORD=${{ secrets.UMAMI_PASSWORD }}
          NEXT_PUBLIC_UMAMI_URL=${{ vars.NEXT_PUBLIC_UMAMI_URL }}
          NEXT_PUBLIC_UMAMI_SITE_ID=${{ vars.NEXT_PUBLIC_UMAMI_SITE_ID }}
          USESEND_URL=${{ vars.USESEND_URL }}
          USESEND_API_KEY=${{ secrets.USESEND_API_KEY }}
          USESEND_DEFAULT_FROM_ADDRESS=${{ vars.USESEND_DEFAULT_FROM_ADDRESS }}
          USESEND_DEFAULT_FROM_NAME=${{ vars.USESEND_DEFAULT_FROM_NAME }}
          OPENAI_API_KEY=${{ secrets.OPENAI_API_KEY }}
          ANTHROPIC_API_KEY=${{ secrets.ANTHROPIC_API_KEY }}
          MAPBOX_API_KEY=${{ secrets.MAPBOX_API_KEY }}
          EOF

      # Temporary diagnostic: prove which keys actually got a non-empty
      # value without ever printing a value itself. Remove once the
      # DATABASE_URL mystery (missing MongoDB connection URL despite the
      # secret existing in this environment) is resolved.
      - name: Debug build env secret file (keys only, no values)
        run: |
          echo "line count: $(wc -l < /tmp/build_env)"
          while IFS='=' read -r key value; do
            if [ -z "$value" ]; then
              echo "EMPTY: $key"
            else
              echo "set:   $key (${#value} chars)"
            fi
          done < /tmp/build_env

      - name: Build & push app image
        uses: docker/build-push-action@263435318d21b8e681c14492fe198d362a7d2c83 # v6.18.0
        with:
          context: .
          target: app
          push: true
          tags: ${{ env.IMAGE_BASE }}-app:sha-${{ github.event.pull_request.head.sha }}
          cache-from: type=gha,scope=app
          cache-to: type=gha,mode=max,scope=app
          secret-files: |
            build_env=/tmp/build_env

      # The builder stage (with .next already built) is reused verbatim for
      # the worker target via Docker's layer cache — this does not re-run
      # `pnpm run build`.
      - name: Build & push worker image
        uses: docker/build-push-action@263435318d21b8e681c14492fe198d362a7d2c83 # v6.18.0
        with:
          context: .
          target: worker
          push: true
          tags: ${{ env.IMAGE_BASE }}-worker:sha-${{ github.event.pull_request.head.sha }}
          cache-from: type=gha,scope=app
          cache-to: type=gha,mode=max,scope=app
          secret-files: |
            build_env=/tmp/build_env

  docker-app-production:
    name: Build app + worker images (Production)
    needs: test
    if: github.event.pull_request.base.ref == 'main'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    environment: Production
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      # Reaches the same database over Tailscale that Dokploy currently does,
      # so `pnpm run build`'s generateStaticParams() calls resolve exactly as
      # they do on the deployment server today.
      - name: Connect to Tailscale
        uses: tailscale/github-action@780049a30b6ff5c378a9e7b389d15ece7a204888 # v4.1.3
        with:
          oauth-client-id: ${{ secrets.TS_OAUTH_CLIENT_ID }}
          oauth-secret: ${{ secrets.TS_OAUTH_SECRET }}
          tags: tag:ci

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@e468171a9de216ec08956ac3ada2f0791b6bd435 # v3.11.1

      - name: Log in to ghcr.io
        uses: docker/login-action@5e57cd118135c172c3672efd75eb46360885c0ef # v3.6.0
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      # See docker-app-development's identical step for why this file
      # exists and how it's consumed.
      - name: Write build env secret file
        run: |
          umask 077
          cat > /tmp/build_env <<EOF
          SERVER_HOST=${{ vars.SERVER_HOST }}
          SERVER_URL=${{ vars.SERVER_URL }}
          STATUS_PAGE_URL=${{ vars.STATUS_PAGE_URL }}
          STATUS_PAGE_HEARTBEAT_URL=${{ vars.STATUS_PAGE_HEARTBEAT_URL }}
          PAYLOAD_SECRET=${{ secrets.PAYLOAD_SECRET }}
          PREVIEW_SECRET=${{ secrets.PREVIEW_SECRET }}
          CRON_SECRET=${{ secrets.CRON_SECRET }}
          DATABASE_URL=${{ secrets.DATABASE_URL }}
          REDIS_URL=${{ secrets.REDIS_URL }}
          S3_BUCKET=${{ vars.S3_BUCKET }}
          S3_SECRET_KEY=${{ secrets.S3_SECRET_KEY }}
          S3_REGION=${{ vars.S3_REGION }}
          S3_ACCESS_KEY=${{ secrets.S3_ACCESS_KEY }}
          S3_ENDPOINT=${{ vars.S3_ENDPOINT }}
          UMAMI_USERNAME=${{ secrets.UMAMI_USERNAME }}
          UMAMI_PASSWORD=${{ secrets.UMAMI_PASSWORD }}
          NEXT_PUBLIC_UMAMI_URL=${{ vars.NEXT_PUBLIC_UMAMI_URL }}
          NEXT_PUBLIC_UMAMI_SITE_ID=${{ vars.NEXT_PUBLIC_UMAMI_SITE_ID }}
          USESEND_URL=${{ vars.USESEND_URL }}
          USESEND_API_KEY=${{ secrets.USESEND_API_KEY }}
          USESEND_DEFAULT_FROM_ADDRESS=${{ vars.USESEND_DEFAULT_FROM_ADDRESS }}
          USESEND_DEFAULT_FROM_NAME=${{ vars.USESEND_DEFAULT_FROM_NAME }}
          OPENAI_API_KEY=${{ secrets.OPENAI_API_KEY }}
          ANTHROPIC_API_KEY=${{ secrets.ANTHROPIC_API_KEY }}
          MAPBOX_API_KEY=${{ secrets.MAPBOX_API_KEY }}
          EOF

      - name: Build & push app image
        uses: docker/build-push-action@263435318d21b8e681c14492fe198d362a7d2c83 # v6.18.0
        with:
          context: .
          target: app
          push: true
          tags: ${{ env.IMAGE_BASE }}-app:sha-${{ github.event.pull_request.head.sha }}
          cache-from: type=gha,scope=app
          cache-to: type=gha,mode=max,scope=app
          secret-files: |
            build_env=/tmp/build_env

      # The builder stage (with .next already built) is reused verbatim for
      # the worker target via Docker's layer cache — this does not re-run
      # `pnpm run build`.
      - name: Build & push worker image
        uses: docker/build-push-action@263435318d21b8e681c14492fe198d362a7d2c83 # v6.18.0
        with:
          context: .
          target: worker
          push: true
          tags: ${{ env.IMAGE_BASE }}-worker:sha-${{ github.event.pull_request.head.sha }}
          cache-from: type=gha,scope=app
          cache-to: type=gha,mode=max,scope=app
          secret-files: |
            build_env=/tmp/build_env

  docker-storybook:
    name: Build storybook image
    needs: test
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@e468171a9de216ec08956ac3ada2f0791b6bd435 # v3.11.1

      - name: Log in to ghcr.io
        uses: docker/login-action@5e57cd118135c172c3672efd75eb46360885c0ef # v3.6.0
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build & push storybook image
        uses: docker/build-push-action@263435318d21b8e681c14492fe198d362a7d2c83 # v6.18.0
        with:
          context: .
          target: storybook
          push: true
          tags: ${{ env.IMAGE_BASE }}-storybook:sha-${{ github.event.pull_request.head.sha }}
          cache-from: type=gha,scope=storybook
          cache-to: type=gha,mode=max,scope=storybook
