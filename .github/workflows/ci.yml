name: CI

# Reusable checks shared by pull requests (lint-and-test.yml) and pushes
# (build-and-deploy.yml): lint and unit tests, one environment-agnostic Next.js
# compile, and E2E tests against the output that would ship.
#
# The compile needs no database and inlines no environment-specific value
# (guarded by scripts/check-env-leak.mjs), so the same `.next` is tested here and
# later finalised (`--experimental-build-mode=generate`) with production
# values by the deploy job.
on:
  workflow_call:
    inputs:
      ref:
        description: Git ref to check out (defaults to the triggering ref)
        type: string
        default: ''
    secrets:
      SENTRY_AUTH_TOKEN:
        description: Uploads source maps during the compile (push runs only)
        required: false
      SENTRY_ORG:
        required: false
      SENTRY_PROJECT:
        required: false

permissions:
  contents: read

jobs:
  lint:
    name: Lint
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ inputs.ref }}
          # commitlint needs the range between base and head
          fetch-depth: 0

      - name: Setup
        uses: ./.github/actions/setup

      # Pushes to main carry the release commit and merge commits, which are
      # not authored by the commit convention; only PR ranges are checked.
      - name: Validate commit messages
        if: github.event_name == 'pull_request'
        run: >-
          bun x commitlint
          --from ${{ github.event.pull_request.base.sha }}
          --to ${{ github.event.pull_request.head.sha }}
          --verbose

      - name: Lint
        run: bun run lint

      - name: Check dependency version groups
        run: bun run deps:lint

      # Generated files are committed; a stale one means someone changed a
      # collection/field/block without running `bun run generate`.
      - name: Check generated files are up to date
        run: |
          # payload.config.ts reads the environment when it loads
          # shellcheck disable=SC2046 # word splitting yields one KEY=value per word
          export $(grep -v '^#' .env.test | grep -v '^$' | xargs)
          bun run generate
          git diff --exit-code -- src/types/payload.ts "app/(payload)/admin/importMap.js"

      - name: Lint workflows
        run: docker run --rm -v "$PWD:/repo" -w /repo rhysd/actionlint:1.7.7 -color

  # Static security analysis beyond Oxlint's rules: Node.js sinks (child
  # processes, fs paths, eval), TypeScript and React patterns, and hardcoded
  # secrets (Oxlint has no secrets rule). Accepted findings are marked in
  # place with `// nosemgrep: <rule>` and a reason.
  semgrep:
    name: Semgrep
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ inputs.ref }}

      - name: Scan
        run: >-
          docker run --rm -v "$PWD:/src" -w /src semgrep/semgrep:1.177.0
          semgrep scan
          --config p/nodejs --config p/typescript --config p/react --config p/secrets
          --metrics=off --error
          --exclude node_modules --exclude .next --exclude out

  test:
    name: Unit Tests
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ inputs.ref }}

      - name: Setup
        uses: ./.github/actions/setup

      - name: Run unit tests with coverage
        run: bun run test:coverage

      - name: Upload coverage
        if: always()
        uses: actions/upload-artifact@v4 # TODO: pin to a commit SHA like the other actions
        with:
          name: coverage
          path: coverage/
          retention-days: 7
          if-no-files-found: ignore

  compile:
    name: Compile
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    environment: Testing
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ inputs.ref }}

      - name: Setup
        uses: ./.github/actions/setup

      # Turbopack's persistent cache; the only part of .next Next documents as
      # worth restoring between builds.
      - name: Restore Next.js build cache
        uses: actions/cache@v4 # TODO: pin to a commit SHA like the other actions
        with:
          path: .next/cache
          # `bun-` keeps caches built against pnpm's node_modules/.pnpm layout
          # from being restored: their module paths no longer exist, and a
          # build started from one hung until the job timed out.
          key: next-cache-bun-${{ runner.os }}-${{ hashFiles('bun.lock') }}-${{ github.sha }}
          restore-keys: |
            next-cache-bun-${{ runner.os }}-${{ hashFiles('bun.lock') }}-
            next-cache-bun-${{ runner.os }}-

      # `compile` never touches the database or renders a page; next.config.ts
      # only needs a schema-valid environment, which .env.test provides. The
      # Sentry secrets are only passed on push runs, so pull requests never
      # upload source maps.
      - name: Compile
        run: |
          # shellcheck disable=SC2046 # word splitting yields one KEY=value per word
          export $(grep -v '^#' .env.test | grep -v '^$' | xargs)
          bun x next build --experimental-build-mode=compile
        env:
          NODE_ENV: production
          SENTRY_AUTH_TOKEN: ${{ secrets.SENTRY_AUTH_TOKEN }}
          SENTRY_ORG: ${{ secrets.SENTRY_ORG }}
          SENTRY_PROJECT: ${{ secrets.SENTRY_PROJECT }}

      # Anything from .env.test inside the output was inlined at build time and
      # would ship to production.
      - name: Check no environment values were inlined
        run: node scripts/check-env-leak.mjs .next .env.test

      # Turbopack links .next/node_modules/* into node_modules with relative
      # symlinks; upload-artifact would copy the targets and lose their
      # siblings (sharp without detect-libc), so the output travels as a tar.
      - name: Pack compiled output
        run: tar -cf "$RUNNER_TEMP/next-compile.tar" --exclude=.next/cache .next

      - name: Upload compiled output
        uses: actions/upload-artifact@v4 # TODO: pin to a commit SHA like the other actions
        with:
          name: next-compile
          path: ${{ runner.temp }}/next-compile.tar
          retention-days: 1
          if-no-files-found: error

  e2e:
    name: E2E Tests
    needs: compile
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    environment: Testing
    # Pull requests share one set of Testing services, so their runs must not
    # overlap. GitHub keeps only one pending run per group (a newer one replaces
    # it), which is fine for PRs. Pushes gate a deploy and must never be
    # cancelled, so they use local containers and a group of their own.
    concurrency:
      group: ${{ github.event_name == 'pull_request' && 'e2e-testing' || format('e2e-{0}', github.run_id) }}
      cancel-in-progress: false
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ inputs.ref }}

      # Set only for pull requests where the Testing environment's secrets are
      # readable (not forks or dependabot); otherwise the job uses local
      # containers. Read in a step: environment secrets reach steps, and every
      # later step checks env.TEST_SERVICES_HOST.
      - name: Detect Testing services
        if: github.event_name == 'pull_request'
        run: echo "TEST_SERVICES_HOST=$TEST_SERVICES_HOST" >> "$GITHUB_ENV"
        env:
          TEST_SERVICES_HOST: ${{ secrets.TEST_SERVICES_HOST }}

      - name: Setup
        uses: ./.github/actions/setup

      - name: Resolve Playwright version
        id: playwright
        run: echo "version=$(bun x playwright --version | awk '{print $2}')" >> "$GITHUB_OUTPUT"

      - name: Cache Playwright browsers
        id: playwright-cache
        uses: actions/cache@v4 # TODO: pin to a commit SHA like the other actions
        with:
          path: ~/.cache/ms-playwright
          key: playwright-${{ runner.os }}-${{ steps.playwright.outputs.version }}

      - name: Install Playwright browsers
        if: steps.playwright-cache.outputs.cache-hit != 'true'
        run: bun x playwright install --with-deps chromium

      - name: Install Playwright system dependencies
        if: steps.playwright-cache.outputs.cache-hit == 'true'
        run: bun x playwright install-deps chromium

      - name: Download compiled output
        uses: actions/download-artifact@v4 # TODO: pin to a commit SHA like the other actions
        with:
          name: next-compile
          path: ${{ runner.temp }}

      - name: Unpack compiled output
        run: tar -xf "$RUNNER_TEMP/next-compile.tar"

      # .env.test is the base for every value; Testing services (below) only
      # override the connection settings.
      - name: Load .env.test into job environment
        run: grep -v '^#' .env.test | grep -v '^$' >> "$GITHUB_ENV"

      - name: Use Testing services
        if: env.TEST_SERVICES_HOST != ''
        run: |
          {
            echo "DATABASE_URL=${DATABASE_URL_TESTING}"
            echo "REDIS_URL=${REDIS_URL_TESTING}"
            echo "S3_ENDPOINT=${S3_ENDPOINT_TESTING}"
            echo "S3_BUCKET=${S3_BUCKET_TESTING}"
            echo "S3_REGION=${S3_REGION_TESTING}"
            echo "S3_ACCESS_KEY=${S3_ACCESS_KEY_TESTING}"
            echo "S3_SECRET_KEY=${S3_SECRET_KEY_TESTING}"
          } >> "$GITHUB_ENV"
        env:
          DATABASE_URL_TESTING: ${{ secrets.DATABASE_URL }}
          REDIS_URL_TESTING: ${{ secrets.REDIS_URL }}
          S3_ENDPOINT_TESTING: ${{ secrets.S3_ENDPOINT }}
          S3_BUCKET_TESTING: ${{ secrets.S3_BUCKET }}
          S3_REGION_TESTING: ${{ secrets.S3_REGION }}
          S3_ACCESS_KEY_TESTING: ${{ secrets.S3_ACCESS_KEY }}
          S3_SECRET_KEY_TESTING: ${{ secrets.S3_SECRET_KEY }}

      - name: Connect to Tailscale
        if: env.TEST_SERVICES_HOST != ''
        uses: tailscale/github-action@780049a30b6ff5c378a9e7b389d15ece7a204888 # v4.1.3
        with:
          oauth-client-id: ${{ secrets.TS_OAUTH_CLIENT_ID }}
          oauth-secret: ${{ secrets.TS_OAUTH_SECRET }}
          tags: tag:ci
          args: --accept-dns=true

      # Empties the Testing Mongo, Redis and bucket, so every run starts from
      # nothing. The Dokploy rebuild is skipped: `mongo.rebuild` has returned
      # a 500 and left the Testing Mongo stopped.
      - name: Reset Testing services
        if: env.TEST_SERVICES_HOST != ''
        run: node scripts/reset-test-services.mjs
        env:
          DOKPLOY_REBUILD: 'false'

      # Forks and dependabot cannot reach the Testing services.
      - name: Start local services (Mongo, Redis, S3)
        if: env.TEST_SERVICES_HOST == ''
        run: docker compose up -d --wait

      # The smoke tests hit the CMS-driven homepage and admin login screen,
      # which need the schema and seed documents (e.g. the `home` page)
      # that 00000001_initialize_basic_site creates.
      - name: Run database migrations
        run: bun run migrate

      # blog.spec.ts needs published posts. seed:posts creates its own topics,
      # and each post fetches one placeholder image from picsum.photos, so
      # the count stays small.
      - name: Seed blog content
        run: bun run seed:posts -- --count 2

      # resume.spec.ts needs an older and a newer resume document; the seed
      # writes them directly, without generating PDFs.
      - name: Seed resume documents
        run: bun run seed:resume-documents

      # Prerenders every route (PPR shells included) against the seeded database.
      - name: Generate
        run: bun x next build --experimental-build-mode=generate
        env:
          NODE_ENV: production

      - name: Assemble web image contents
        run: node scripts/assemble-images.mjs web

      - name: Run E2E tests against the assembled output
        run: bun run test:e2e
        env:
          E2E_SERVER_COMMAND: node --env-file=.env.test out/web/server.js
          HOSTNAME: localhost
          PORT: '3000'
          NODE_ENV: production

      # The worker image is assembled from a production-only install; starting
      # it here proves it can load the Payload config, reach the database and
      # load and run a handler: the scheduled heartbeat task (every minute)
      # logs "Ping" once the runner has executed it.
      - name: Smoke test the worker output
        run: |
          node scripts/assemble-images.mjs worker
          (cd out/worker && exec node scripts/start-worker.mjs > "$RUNNER_TEMP/worker.log" 2>&1) &
          for _ in $(seq 1 30); do
            curl -fsS http://localhost:3010/health > /dev/null && break
            sleep 5
          done
          for _ in $(seq 1 30); do
            grep -q '^Ping' "$RUNNER_TEMP/worker.log" && { echo "worker ran a job"; exit 0; }
            sleep 5
          done
          echo "worker did not run a job"; tail -n 80 "$RUNNER_TEMP/worker.log"; exit 1
        env:
          NODE_ENV: production
          PORT: '3010'

      - name: Upload Playwright report
        if: failure()
        uses: actions/upload-artifact@v4 # TODO: pin to a commit SHA like the other actions
        with:
          name: playwright-report
          path: |
            playwright-report/
            test-results/
          retention-days: 7
          if-no-files-found: ignore
