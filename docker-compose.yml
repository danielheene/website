services:
  postgres:
    image: postgres:alpine
    hostname: postgres
    container_name: postgres
    restart: on-failure
    environment:
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_DB: ${POSTGRES_DATABASE}
    ports:
      - "5432:5432"
    volumes:
      - postgres:/var/lib/postgresql/data

  pgweb:
    image: sosedoff/pgweb
    hostname: pgweb
    container_name: pgweb  # optional
    restart: on-failure
    environment:
      PGWEB_DATABASE_URL: postgres://${POSTGRES_USER}:${POSTGRES_PASSWORD}@postgres:5432/${POSTGRES_DATABASE}?sslmode=disable
    ports:
      - "8081:8081"
    links:
      - postgres:postgres  # my database container is called postgres, not db
    depends_on:
      - postgres  # my database container is called postgres, not db

  pgadmin:
    image: dpage/pgadmin4
    hostname: pgadmin
    container_name: pgadmin
    restart: on-failure
    environment:
      PGADMIN_DEFAULT_EMAIL: ${POSTGRES_USER}@example.com
      PGADMIN_DEFAULT_PASSWORD: ${POSTGRES_USER}
      PGADMIN_CONFIG_SERVER_MODE: "False"
      PGADMIN_CONFIG_MASTER_PASSWORD_REQUIRED: "False"
    ports:
      - "8080:80"
    links:
      - postgres:postgres
    depends_on:
      - postgres

volumes:
  postgres:
