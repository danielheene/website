x-healthcheck-props: &healthcheck-props
  interval: 5s
  timeout: 20s
  retries: 10

services:
  app:
    build:
      context: .
    restart: always
    expose:
      - 3000
    environment:
      - NODE_ENV=${NODE_ENV}
      - NEXT_PUBLIC_SERVER_HOST=${NEXT_PUBLIC_SERVER_HOST}
      - NEXT_PUBLIC_SERVER_URL=${NEXT_PUBLIC_SERVER_URL}
      - PAYLOAD_SECRET=${PAYLOAD_SECRET}
      - PREVIEW_SECRET=${PREVIEW_SECRET}
      - CRON_SECRET=${CRON_SECRET}
      - S3_BUCKET=${S3_BUCKET}
      - S3_ACCESS_KEY=${S3_ACCESS_KEY}
      - S3_SECRET_KEY=${S3_SECRET_KEY}
      - S3_REGION=${S3_REGION}
      - S3_ENDPOINT=${S3_ENDPOINT}
      - DATABASE_URL=${DATABASE_URL}
      - REDIS_URL=${REDIS_URL}
      - UMAMI_HOST_URL=${UMAMI_HOST_URL}
      - UMAMI_WEBSITE_ID=${UMAMI_WEBSITE_ID}
      - USESEND_API_KEY=${USESEND_API_KEY}
      - USESEND_URL=${USESEND_URL}
    depends_on:
      mongo:
        condition: service_healthy
        restart: true
      redis:
        condition: service_healthy
        restart: true
      storage:
        condition: service_healthy
        restart: true
    healthcheck:
      <<: *healthcheck-props
      test: [ "CMD-SHELL", "curl -f http://localhost:3000/api/heartbeat" ]

  mongo:
    image: mongo:8
    restart: always
    expose:
      - 27017
    volumes:
      - "mongo-data:/data/db"
    command: --storageEngine=wiredTiger
    healthcheck:
      <<: *healthcheck-props
      test: [ "CMD-SHELL", "echo 'db.runCommand(\"ping\").ok' | mongosh 127.0.0.1:27017/productiondb --quiet | grep -q 1" ]

  redis:
    image: redis:8-alpine
    restart: always
    expose:
      - 6379
    volumes:
      - "redis-data:/data"
    command: redis-server --maxmemory-policy noeviction
    healthcheck:
      <<: *healthcheck-props
      test: [ "CMD-SHELL", "redis-cli PING" ]

  storage:
    image: rustfs/rustfs:latest
    restart: always
    expose:
      - 9000
      - 9001
    environment:
      - RUSTFS_ACCESS_KEY=${S3_ACCESS_KEY}
      - RUSTFS_SECRET_KEY=${S3_SECRET_KEY}
    volumes:
      - "storage-data:/data"
    healthcheck:
      <<: *healthcheck-props
      test: [ "CMD-SHELL", "curl -f http://127.0.0.1:9000/health" ]

  create-bucket:
    image: minio/mc:RELEASE.2025-08-13T08-35-41Z
    restart: "no"
    depends_on:
      storage:
        condition: service_healthy
    environment:
      - S3_ENDPOINT=${S3_ENDPOINT}
      - S3_ACCESS_KEY=${S3_ACCESS_KEY}
      - S3_SECRET_KEY=${S3_SECRET_KEY}
      - S3_BUCKET=${S3_BUCKET}
    entrypoint:
      - /bin/sh
      - -c
      - |
        set -e

        until mc alias set storage $${S3_ENDPOINT} $${S3_ACCESS_KEY} $${S3_SECRET_KEY}; do
          echo 'storage is not ready yet, retrying in 2 seconds...'
          sleep 2
        done

        echo 'create bucket if not exists'
        mc mb storage/$${S3_BUCKET} --ignore-existing

        echo 'set policy PUBLIC (download only) for bucket'
        mc anonymous set download storage/$${S3_BUCKET}

volumes:
  mongo-data:
  redis-data:
  storage-data:
