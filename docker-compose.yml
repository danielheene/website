x-healthcheck-props: &healthcheck-props
  interval: 5s
  timeout: 20s
  retries: 10



services:
  mongo:
    image: mongo:8
    restart: always
    ports:
      - "27017:27017"
    volumes:
      - "mongo-data:/data/db"
    command: --storageEngine=wiredTiger
    healthcheck:
      <<: *healthcheck-props
      test: [ "CMD-SHELL", "echo 'db.runCommand(\"ping\").ok' | mongosh 127.0.0.1:27017/productiondb --quiet | grep -q 1" ]

  redis:
    image: redis:8-alpine
    restart: always
    ports:
      - "6379:6379"
    volumes:
      - "redis-data:/data"
    command: redis-server --maxmemory-policy noeviction
    healthcheck:
      <<: *healthcheck-props
      test: [ "CMD-SHELL", "redis-cli PING" ]

  storage:
    image: rustfs/rustfs:latest
    restart: always
    ports:
      - "9000:9000"
      - "9001:9001"
    environment:
      RUSTFS_ACCESS_KEY: ${S3_ACCESS_KEY}
      RUSTFS_SECRET_KEY: ${S3_SECRET_KEY}
    env_file:
      - path: .env.local
        required: true
    volumes:
      - "storage-data:/data"
    healthcheck:
      <<: *healthcheck-props
      test: [ "CMD-SHELL", "curl -f http://127.0.0.1:9000/health" ]

  create-bucket:
    image: minio/mc:RELEASE.2025-08-13T08-35-41Z
    restart: "no"
    depends_on:
      storage:
        condition: service_healthy
    env_file:
      - path: .env.local
        required: true
    entrypoint:
      - /bin/sh
      - -c
      - |
        set -e

        until mc alias set storage http://storage:9000 $${S3_ACCESS_KEY} $${S3_SECRET_KEY}; do
          echo 'storage is not ready yet, retrying in 2 seconds...'
          sleep 2
        done

        echo 'create bucket if not exists'
        mc mb storage/$${S3_BUCKET} --ignore-existing

        echo 'set policy PUBLIC (download only) for bucket'
        mc anonymous set download storage/$${S3_BUCKET}

volumes:
  mongo-data:
  redis-data:
  storage-data:
