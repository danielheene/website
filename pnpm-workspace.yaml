# next and wrangler pull older sharp majors transitively. Two libvips builds
# loading into one process collide on Objective-C class names ("Class
# GNotificationCenterDelegate is implemented in both ..."), so every consumer is
# pinned to the version this repo depends on directly.
overrides:
  sharp: ^0.35.3
  redis: 4.7.0
  pdfjs-dist: 5.4.296
  '@emnapi/runtime': ^2.0.0-alpha
  react: ^19.2.7
  react-dom: ^19.2.7

allowBuilds:
  '@sentry/cli': true
  '@swc/core': true
  # the repo uses @napi-rs/canvas (prebuilt); plain `canvas` is only a
  # transitive dep and does not need to compile
  canvas: false
  core-js-pure: true
  esbuild: true
  mongodb-memory-server: true
  node-av: true
  sharp: true
  unrs-resolver: true
  workerd: true

ignoreWorkspaceRootCheck: true
updateNotifier: false
symlink: true
nodeLinker: isolated
hoistWorkspacePackages: false # the default in pnpm v9 is true, but that can break our runtime dependency checks
minimumReleaseAgeExclude:
  - '@radix-ui/react-arrow@1.1.10'
  - '@radix-ui/react-dismissable-layer@1.1.13'
  - '@radix-ui/react-popper@1.3.1'
  - '@radix-ui/react-portal@1.1.12'
  - '@radix-ui/react-primitive@2.1.6'
  - '@radix-ui/react-slot@1.3.0'
  - '@radix-ui/react-tooltip@1.2.10'
  - '@radix-ui/react-visually-hidden@1.2.6'
  - '@radix-ui/react-collection@1.1.10'
  - '@radix-ui/react-dropdown-menu@2.1.18'
  - '@radix-ui/react-focus-scope@1.1.10'
  - '@radix-ui/react-menu@2.1.18'
  - '@radix-ui/react-roving-focus@1.1.13'
  - '@radix-ui/react-switch@1.3.1'
