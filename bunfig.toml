[install]
# One flat node_modules, as Next, Payload and Storybook expect to resolve their
# peers from the project root.
linker = "hoisted"
# Carried over from pnpm: a published version must be a day old before it is
# installed, which keeps freshly compromised releases out of the lockfile.
minimumReleaseAge = 86400
minimumReleaseAgeExcludes = [
  "@radix-ui/react-arrow",
  "@radix-ui/react-collection",
  "@radix-ui/react-dismissable-layer",
  "@radix-ui/react-dropdown-menu",
  "@radix-ui/react-focus-scope",
  "@radix-ui/react-menu",
  "@radix-ui/react-popper",
  "@radix-ui/react-portal",
  "@radix-ui/react-primitive",
  "@radix-ui/react-roving-focus",
  "@radix-ui/react-slot",
  "@radix-ui/react-switch",
  "@radix-ui/react-tooltip",
  "@radix-ui/react-visually-hidden",
  "@trieb.work/nextjs-turbo-redis-cache",
]
